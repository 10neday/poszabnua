<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แซ่บนัว — รายงานยอดขาย</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-stone-50 min-h-screen flex flex-col antialiased">

  <!-- HEADER -->
  <header class="bg-white border-b border-stone-100 sticky top-0 z-40 shadow-sm">
    <div class="max-w-5xl mx-auto px-6 py-3 flex items-center justify-between gap-4">

      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl brand-logo flex items-center justify-center text-white font-extrabold text-base font-eng shadow-md shadow-orange-200">ZN</div>
        <div>
          <h1 class="text-base font-extrabold text-stone-900 leading-tight">แซ่บนัว — รายงาน</h1>
          <p class="text-[10px] text-stone-400 font-medium mt-0.5">ประวัติยอดขาย · Sales Report</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <a href="admin.html" class="flex items-center gap-1.5 text-xs font-semibold text-stone-500 hover:text-stone-800 bg-stone-100 hover:bg-stone-200 border border-stone-200 px-3 py-2 rounded-xl transition-all duration-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          จัดการเมนู
        </a>
        <a href="index.html" class="flex items-center gap-1.5 text-xs font-semibold text-stone-500 hover:text-stone-800 bg-stone-100 hover:bg-stone-200 border border-stone-200 px-3 py-2 rounded-xl transition-all duration-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          กลับหน้า POS
        </a>
      </div>

    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-5xl mx-auto w-full px-6 py-7 flex flex-col gap-5">

    <!-- Today Stats -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">

      <div class="bg-white rounded-2xl px-5 py-4 shadow-sm border border-stone-100">
        <div class="text-[10px] font-bold uppercase tracking-widest text-orange-400 mb-1">บิลวันนี้</div>
        <div id="stat-today-bills" class="text-3xl font-extrabold font-eng text-stone-900 leading-none">—</div>
        <div class="text-[10px] text-stone-400 mt-1.5">บิล</div>
      </div>

      <div class="bg-white rounded-2xl px-5 py-4 shadow-sm border border-orange-100 bg-gradient-to-br from-white to-orange-50">
        <div class="text-[10px] font-bold uppercase tracking-widest text-orange-400 mb-1">ยอดวันนี้</div>
        <div id="stat-today-revenue" class="text-3xl font-extrabold font-eng text-orange-600 leading-none">—</div>
        <div class="text-[10px] text-stone-400 mt-1.5">บาท</div>
      </div>

      <div class="bg-white rounded-2xl px-5 py-4 shadow-sm border border-stone-100">
        <div class="text-[10px] font-bold uppercase tracking-widest text-stone-400 mb-1">เฉลี่ยต่อบิล</div>
        <div id="stat-today-avg" class="text-3xl font-extrabold font-eng text-stone-700 leading-none">—</div>
        <div class="text-[10px] text-stone-400 mt-1.5">บาท</div>
      </div>

      <div class="bg-white rounded-2xl px-5 py-4 shadow-sm border border-stone-100">
        <div class="text-[10px] font-bold uppercase tracking-widest text-stone-400 mb-1">บิลทั้งหมด</div>
        <div id="stat-all-bills" class="text-3xl font-extrabold font-eng text-stone-400 leading-none">—</div>
        <div class="text-[10px] text-stone-400 mt-1.5">บิล (สะสม)</div>
      </div>

    </div>

    <!-- Filter + Clear -->
    <div class="flex items-center justify-between gap-4 bg-white px-5 py-4 rounded-2xl shadow-sm border border-stone-100">
      <div class="flex items-center gap-2">
        <button id="filter-today" class="px-4 py-2 text-sm font-bold rounded-xl bg-orange-500 text-white shadow-md shadow-orange-100 transition-all duration-200">วันนี้</button>
        <button id="filter-all"   class="px-4 py-2 text-sm font-bold rounded-xl bg-stone-100 text-stone-600 transition-all duration-200">ทั้งหมด</button>
      </div>
      <button onclick="clearSalesLog()" class="flex items-center gap-1.5 text-xs font-semibold text-red-400 hover:text-red-600 hover:bg-red-50 border border-red-100 hover:border-red-200 px-3 py-2 rounded-xl transition-all duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        ล้างประวัติ
      </button>
    </div>

    <!-- Bill List -->
    <div id="bill-list-body" class="bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden">
      <div class="flex items-center justify-center py-20 text-stone-400 text-sm">
        <div class="flex flex-col items-center gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-stone-300 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>กำลังโหลด...</span>
        </div>
      </div>
    </div>

  </main>

  <!-- Toast -->
  <div id="toast-notification" class="fixed bottom-6 left-6 z-50 bg-stone-900 text-white py-3 px-5 rounded-2xl shadow-xl border border-stone-800 flex items-center gap-3 transition-all duration-300 transform translate-y-24 opacity-0">
    <div class="w-7 h-7 rounded-xl bg-green-500 flex items-center justify-center shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
      </svg>
    </div>
    <div class="text-sm font-semibold" id="toast-text">เสร็จสิ้น</div>
  </div>

  <script src="report.js"></script>
</body>
</html>
