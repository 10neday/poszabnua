<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แซ่บนัว — จัดการเมนูอาหาร</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-stone-50 min-h-screen flex flex-col antialiased">

  <!-- HEADER -->
  <header class="bg-white border-b border-stone-100 sticky top-0 z-40 shadow-sm">
    <div class="max-w-5xl mx-auto px-6 py-3 flex items-center justify-between gap-4">

      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl brand-logo flex items-center justify-center text-white font-extrabold text-base font-eng shadow-md shadow-orange-200">ZN</div>
        <div>
          <h1 class="text-base font-extrabold text-stone-900 leading-tight">แซ่บนัว — Admin</h1>
          <p class="text-[10px] text-stone-400 font-medium mt-0.5">จัดการเมนูอาหาร · Menu Management</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <a href="report.html" class="flex items-center gap-1.5 text-xs font-semibold text-stone-500 hover:text-stone-800 bg-stone-100 hover:bg-stone-200 border border-stone-200 px-3 py-2 rounded-xl transition-all duration-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          รายงาน
        </a>
        <a href="index.html" class="flex items-center gap-1.5 text-xs font-semibold text-stone-500 hover:text-stone-800 bg-stone-100 hover:bg-stone-200 border border-stone-200 px-3 py-2 rounded-xl transition-all duration-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          กลับหน้า POS
        </a>
      </div>

    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-5xl mx-auto w-full px-6 py-7 flex flex-col gap-5">

    <!-- Stats + Add button -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white px-5 py-4 rounded-2xl shadow-sm border border-stone-100">
      <div class="flex items-center gap-6">
        <div>
          <div class="text-[10px] font-bold uppercase tracking-widest text-stone-400">เมนูทั้งหมด</div>
          <div id="stat-total" class="text-2xl font-extrabold font-eng text-stone-900 leading-none mt-0.5">—</div>
        </div>
        <div class="w-px h-8 bg-stone-200"></div>
        <div>
          <div class="text-[10px] font-bold uppercase tracking-widest text-green-500">เปิดใช้งาน</div>
          <div id="stat-active" class="text-2xl font-extrabold font-eng text-green-600 leading-none mt-0.5">—</div>
        </div>
        <div class="w-px h-8 bg-stone-200"></div>
        <div>
          <div class="text-[10px] font-bold uppercase tracking-widest text-stone-400">ปิดใช้งาน</div>
          <div id="stat-inactive" class="text-2xl font-extrabold font-eng text-stone-400 leading-none mt-0.5">—</div>
        </div>
      </div>
      <button onclick="openAddForm()" class="flex items-center gap-2 bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 px-5 rounded-xl shadow-md shadow-orange-200 transition-all duration-200 text-sm hover:-translate-y-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        เพิ่มเมนูใหม่
      </button>
    </div>

    <!-- (no-db-warning unused in localStorage mode) -->
    <div id="no-db-warning" class="hidden bg-amber-50 border border-amber-200 rounded-2xl px-5 py-4 flex items-start gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-500 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <div>
        <p class="text-sm font-bold text-amber-800">ยังไม่ได้เชื่อมต่อฐานข้อมูล</p>
        <p class="text-xs text-amber-600 mt-1">กรุณาเปิดไฟล์ <code class="bg-amber-100 px-1 rounded font-mono">config.js</code> และใส่ข้อมูล Supabase URL และ Key ของคุณ</p>
      </div>
    </div>

    <!-- Menu Table -->
    <div id="menu-table-container" class="bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden">
      <div id="menu-list-body" class="flex items-center justify-center py-20 text-stone-400 text-sm">
        <div class="flex flex-col items-center gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-stone-300 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>กำลังโหลด...</span>
        </div>
      </div>
    </div>

  </main>

  <!-- ADD / EDIT PANEL (slide from right) -->
  <div id="form-panel" class="fixed top-0 right-0 h-full w-full sm:w-[400px] bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out border-l border-stone-200 flex flex-col">

    <div class="px-6 py-4 border-b border-stone-100 bg-stone-50 flex items-center justify-between">
      <h3 id="form-panel-title" class="text-base font-extrabold text-stone-900">เพิ่มเมนูใหม่</h3>
      <button onclick="closeForm()" class="w-8 h-8 rounded-full bg-stone-200 hover:bg-stone-300 text-stone-600 flex items-center justify-center transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>

    <div class="flex-grow overflow-y-auto p-6 flex flex-col gap-5">
      <input type="hidden" id="form-item-id" value="">

      <div>
        <label class="block text-xs font-bold text-stone-500 mb-1.5">ชื่อเมนูอาหาร <span class="text-red-400">*</span></label>
        <input id="form-name" type="text" placeholder="เช่น ส้มตำไทย" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-2.5 text-sm font-medium text-stone-800 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent focus:bg-white transition-colors">
      </div>

      <div>
        <label class="block text-xs font-bold text-stone-500 mb-1.5">ราคา (บาท) <span class="text-red-400">*</span></label>
        <input id="form-price" type="number" min="0" placeholder="0" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-2.5 text-sm font-bold font-eng text-stone-800 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent focus:bg-white transition-colors">
      </div>

      <div>
        <label class="block text-xs font-bold text-stone-500 mb-1.5">หมวดหมู่</label>
        <div class="flex items-center gap-2">
          <select id="form-category" class="flex-grow bg-stone-50 border border-stone-200 rounded-xl px-4 py-2.5 text-sm font-medium text-stone-800 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent focus:bg-white transition-colors">
            <option value="ส้มตำ">ส้มตำ</option>
            <option value="อาหาร">อาหาร</option>
            <option value="ข้าว/เส้น">ข้าว/เส้น</option>
            <option value="เครื่องดื่ม">เครื่องดื่ม</option>
            <option value="ของหวาน">ของหวาน</option>
            <option value="อื่นๆ">อื่นๆ</option>
          </select>
          <input id="form-category-custom" type="text" placeholder="หรือพิมพ์เอง" class="w-28 bg-stone-50 border border-stone-200 rounded-xl px-3 py-2.5 text-sm font-medium text-stone-800 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent focus:bg-white transition-colors">
        </div>
        <p class="text-[10px] text-stone-400 mt-1.5">เลือกจากรายการ หรือพิมพ์หมวดใหม่ในช่องขวา</p>
      </div>

      <!-- Form error -->
      <p id="form-error" class="text-xs text-red-500 font-semibold opacity-0 transition-opacity duration-200"></p>
    </div>

    <div class="p-6 border-t border-stone-100 flex gap-3">
      <button onclick="closeForm()" class="flex-1 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold py-3 rounded-xl text-sm transition-colors">ยกเลิก</button>
      <button onclick="submitForm()" id="form-submit-btn" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl text-sm shadow-md shadow-orange-200 transition-colors flex items-center justify-center gap-2">
        <span id="form-submit-label">บันทึก</span>
      </button>
    </div>

  </div>

  <!-- Toast -->
  <div id="toast-notification" class="fixed bottom-6 left-6 z-50 bg-stone-900 text-white py-3 px-5 rounded-2xl shadow-xl border border-stone-800 flex items-center gap-3 transition-all duration-300 transform translate-y-24 opacity-0">
    <div class="w-7 h-7 rounded-xl bg-green-500 flex items-center justify-center shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
      </svg>
    </div>
    <div class="text-sm font-semibold" id="toast-text">เสร็จสิ้น</div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
